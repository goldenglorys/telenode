# General config
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_NEWLIB_LIBC=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Networking
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n

# TODO(replace-with-mqtt): removed CONFIG_NET_SOCKETS_TLS_PRIORITY=35, which
# forced native/software TLS instead of modem-offloaded TLS — needed for
# Golioth's CoAP/DTLS stack, but actively wrong for uplink_mqtt.c. Per
# subsys/net/lib/sockets/Kconfig: NET_SOCKETS_OFFLOAD_PRIORITY defaults to
# 40, NET_SOCKETS_TLS_PRIORITY defaults to 45 (40 < 45 => offloaded/modem
# TLS wins, which is what modem_key_mgmt-provisioned credentials require).
# Lowering TLS_PRIORITY to 35 flipped that (40 > 35 => native TLS wins
# instead), which would silently look for credentials via
# tls_credential_add()'s volatile store — never populated here, since
# credentials are provisioned into the modem's own storage — producing a
# TLS handshake failure that's very hard to diagnose over cellular. Leaving
# both priorities at their Kconfig defaults keeps modem-offloaded TLS active.

# Modem library
CONFIG_NRF_MODEM_LIB=y

# LTE connectivity with network connection manager
CONFIG_NRF_MODEM_LIB_NET_IF=y
CONFIG_NRF_MODEM_LIB_NET_IF_AUTO_START=y
CONFIG_NRF_MODEM_LIB_NET_IF_AUTO_CONNECT=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024

# Increased sysworkq size, due to LTE connectivity
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Disable options y-selected by NCS for no good reason
CONFIG_MBEDTLS_KEY_EXCHANGE_DHE_PSK_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_DHE_RSA_ENABLED=n
CONFIG_MBEDTLS_PK_PARSE_EC_EXTENDED=n

# MbedTLS configuration to support p-384 curve. These options
# enable using the MbedTLS built-in support for operations not
# supported by the default nRF Oberon crypto backend
CONFIG_NORDIC_SECURITY_BACKEND=n
CONFIG_MBEDTLS_LEGACY_CRYPTO_C=y

# Configure Golioth SDK dependencies (for NCS)
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=2048
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048

# Generate MCUboot compatible images
CONFIG_BOOTLOADER_MCUBOOT=y

# TODO(replace-with-mqtt): CONFIG_NETWORK_INFO unconditionally compiles all
# of zephyr-network-info's backend .c files together (see its CMakeLists.txt),
# and network_info_modem_info.c/network_info_placeholder.c each hard-#include
# <golioth/rpc.h> for network_info_add_to_map()'s golioth_rpc_status return
# type — that function is Golioth-RPC-transport-specific and isn't ported
# (see AUDIT.md). Its own Kconfig help text is explicit that this option's
# purpose is "Return network information to a Golioth RPC or Log function".
# Disabled since nothing in src/ calls into this library anymore; re-enable
# once something (e.g. an MQTT status-topic publisher) calls the library's
# generic network_info_log() and the vendored .c files are correspondingly
# adjusted upstream or forked.
CONFIG_NETWORK_INFO=n
CONFIG_MODEM_INFO=y

# CAN init priority is lower than SPI init priority by default
# See https://github.com/zephyrproject-rtos/zephyr/issues/55745
CONFIG_CAN_INIT_PRIORITY=80
