manifest:
  version: 1.0

  projects:
    # Direct import of the zephyr/nrf/HAL tree, pinned at the exact revision
    # and name-allowlist previously resolved transitively through the now-
    # removed `golioth` (golioth-firmware-sdk) project's
    # `import: {file: west-ncs.yml}` (that file just pointed here at the same
    # revision with `import: true`). Verified byte-identical resolution
    # before/after this change — see AUDIT.md.
    #
    # Note: `path` is bare `nrf` (not `deps/nrf`) because `import.path-prefix`
    # below applies to this project's own resolved path too, not just to the
    # projects its import pulls in — `deps` + `nrf` = `deps/nrf`. The
    # now-removed `golioth` project had the same quirk in reverse: its bare
    # `path: modules/lib/golioth-firmware-sdk` resolved to
    # `deps/modules/lib/golioth-firmware-sdk` on disk because of its own
    # `import.path-prefix: deps`.
    - name: nrf
      path: nrf
      revision: v3.1.1
      url: https://github.com/nrfconnect/sdk-nrf
      import:
        path-prefix: deps
        name-allowlist:
          - zephyr
          - cmsis_6
          - hal_nordic
          - mbedtls
          - mbedtls-nrf
          - mcuboot
          - net-tools
          - nrfxlib
          - oberon-psa-crypto
          - qcbor
          - segger
          - tfm-mcuboot
          - tinycrypt
          - trusted-firmware-m
          - zcbor

    - name: zephyr-network-info
      path: deps/modules/lib/network-info
      revision: v1.2.0
      url: https://github.com/golioth/zephyr-network-info

    - name: golioth-battery-monitor
      path: deps/modules/lib/battery-monitor
      revision: v1.1.0
      url: https://github.com/golioth/battery-monitor

    - name: minmea
      path: app/src/lib/minmea
      revision: 85439b97dd4984c5efb84ce954b85088e781dae8
      url: https://github.com/kosma/minmea.git

  self:
    path: app
