name: Build Zephyr binaries

on:
  workflow_dispatch:
    inputs:
      ZEPHYR_SDK:
        required: true
        type: string
        default: 0.17.4
      BOARD:
        required: true
        type: string
        default: nrf9160dk/nrf9160/ns
      ARTIFACT:
        required: true
        type: boolean
        default: false
      TAG:
        type: string

  workflow_call:
    inputs:
      ZEPHYR_SDK:
        required: true
        type: string
      BOARD:
        required: true
        type: string
      ARTIFACT:
        required: true
        type: boolean
      TAG:
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    # Tag format changed upstream (was `<ver>-SDK-v0`, now `sdk-<ver>`) —
    # verified against the live Docker Hub tag list before updating this.
    # Only `sdk-0.17.4` and `sdk-1.0.1` exist there as of this fork; this
    # workspace's own SDK (`deps/zephyr/SDK_VERSION`) is 0.17.1, so this is
    # the closest available tag, not an exact match — flagged in AUDIT.md.
    container: golioth/golioth-zephyr-base:sdk-${{ inputs.ZEPHYR_SDK }}

    env:
      ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains/zephyr-sdk-${{ inputs.ZEPHYR_SDK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: app

      - name: Process Board name
        id: nicename
        shell: bash
        run: |
          BOARD_NICENAME=${{ inputs.BOARD }}
          BOARD_NICENAME=${BOARD_NICENAME//\//_}
          echo "BOARD_NICENAME=${BOARD_NICENAME}" >> $GITHUB_OUTPUT

      - name: Setup West workspace
        run: |
          west init -l app
          west update --narrow -o=--depth=1
          west zephyr-export
          pip3 install -r deps/zephyr/scripts/requirements-base.txt
          # Needed for TF-M
          pip3 install cryptography pyasn1 pyyaml cbor>=1.0.0 imgtool>=1.9.0 jinja2 click

      - name: Build with West
        run: |
          west build -p -b ${{ inputs.BOARD }} --sysbuild app

      - name: Prepare artifacts
        shell: bash
        if: inputs.ARTIFACT == true && inputs.TAG != ''

        run: |
          cd build
          mkdir -p artifacts
          mv merged.hex                   ./artifacts/can-asset-tracker_${{ inputs.TAG }}_${{ steps.nicename.outputs.BOARD_NICENAME }}_full.hex
          mv app/zephyr/zephyr.signed.bin ./artifacts/can-asset-tracker_${{ inputs.TAG }}_${{ steps.nicename.outputs.BOARD_NICENAME }}_update.bin
          mv app/zephyr/zephyr.elf        ./artifacts/can-asset-tracker_${{ inputs.TAG }}_${{ steps.nicename.outputs.BOARD_NICENAME }}.elf

      # Run IDs are unique per repo but are reused on re-runs
      - name: Save artifact
        if: inputs.ARTIFACT == true
        uses: actions/upload-artifact@v4
        with:
          name: build_artifacts_${{ github.run_id }}_${{ steps.nicename.outputs.BOARD_NICENAME }}
          path: |
            build/artifacts/*
