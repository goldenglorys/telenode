# SPDX-License-Identifier: Apache-2.0

name: Build Zephyr binaries

# Runs on a plain ubuntu-latest runner and installs Python/west/the Zephyr
# SDK explicitly, rather than depending on a prebuilt container image.
# This previously used `golioth/golioth-zephyr-base`, which broke twice in
# a row (a Docker Hub tag-format change, then a missing `pip3` in the
# image) — Golioth has stated that image is private/internal and not
# intended for external reuse, and changes without notice. Since this
# fork isn't Golioth's project to depend on their infra for, this workflow
# now only depends on public, documented tooling: apt packages and West's
# own `sdk install` command, the same steps documented in README.md's
# Setup section. Slower per run without a baked-in toolchain image, offset
# with caching below.

on:
  workflow_dispatch:
    inputs:
      BOARD:
        required: true
        type: string
        default: nrf9160dk/nrf9160/ns
      ARTIFACT:
        required: true
        type: boolean
        default: false
      TAG:
        type: string

  workflow_call:
    inputs:
      BOARD:
        required: true
        type: string
      ARTIFACT:
        required: true
        type: boolean
      TAG:
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: app

      - name: Process Board name
        id: nicename
        shell: bash
        run: |
          BOARD_NICENAME=${{ inputs.BOARD }}
          BOARD_NICENAME=${BOARD_NICENAME//\//_}
          echo "BOARD_NICENAME=${BOARD_NICENAME}" >> $GITHUB_OUTPUT

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler \
            wget python3-dev python3-pip python3-venv python3-setuptools \
            python3-tk python3-wheel xz-utils file make gcc

      # Keyed on west.yml's own contents: a manifest change (new NCS/Zephyr
      # revision) invalidates both caches and triggers a fresh, correct
      # fetch/install; otherwise both are reused across runs. The Zephyr
      # SDK's exact required version is auto-detected by `west sdk install`
      # from deps/zephyr/SDK_VERSION at install time regardless of this
      # cache, so a cache miss costs time, never correctness.
      - name: Cache Zephyr SDK
        uses: actions/cache@v4
        with:
          path: ~/zephyr-sdk-*
          key: zephyr-sdk-${{ hashFiles('app/west.yml') }}

      - name: Cache west-managed dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: west-deps-${{ hashFiles('app/west.yml') }}

      - name: Setup West workspace
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          source .venv/bin/activate
          pip install wheel west ecdsa
          west init -l app
          west update --narrow -o=--depth=1
          west zephyr-export
          pip install -r deps/zephyr/scripts/requirements-base.txt
          # Needed for TF-M
          pip install cryptography pyasn1 pyyaml cbor>=1.0.0 imgtool>=1.9.0 jinja2 click
          # nRF9160 is Cortex-M33 (arm-zephyr-eabi) only; skip other archs.
          # Non-interactive by default (no -i/--interactive passed).
          west sdk install -t arm-zephyr-eabi

      - name: Build with West
        run: |
          west build -p -b ${{ inputs.BOARD }} --sysbuild app

      - name: Prepare artifacts
        shell: bash
        if: inputs.ARTIFACT == true && inputs.TAG != ''

        run: |
          cd build
          mkdir -p artifacts
          mv merged.hex                   ./artifacts/can-asset-tracker_${{ inputs.TAG }}_${{ steps.nicename.outputs.BOARD_NICENAME }}_full.hex
          mv app/zephyr/zephyr.signed.bin ./artifacts/can-asset-tracker_${{ inputs.TAG }}_${{ steps.nicename.outputs.BOARD_NICENAME }}_update.bin
          mv app/zephyr/zephyr.elf        ./artifacts/can-asset-tracker_${{ inputs.TAG }}_${{ steps.nicename.outputs.BOARD_NICENAME }}.elf

      # Run IDs are unique per repo but are reused on re-runs
      - name: Save artifact
        if: inputs.ARTIFACT == true
        uses: actions/upload-artifact@v4
        with:
          name: build_artifacts_${{ github.run_id }}_${{ steps.nicename.outputs.BOARD_NICENAME }}
          path: |
            build/artifacts/*
