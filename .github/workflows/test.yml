name: Test firmware

on:
  pull_request:

  push:
    branches: [ main ]

# aludel_elixir job removed — that board's overlay/conf was deleted along
# with Golioth Cloud transport (see AUDIT.md); nRF9160-DK is the only
# supported target now. This workflow is a build/compile check only, not
# a real test suite — see docs/TESTING.md for actual verification status.
jobs:
  test_build_nrf9160dk:
    uses: ./.github/workflows/build_zephyr.yml
    with:
      BOARD: nrf9160dk/nrf9160/ns
      ARTIFACT: false
