# TODO(replace-with-mqtt): CONFIG_GOLIOTH_FIRMWARE_SDK and the six service
# switches below it (FW_UPDATE/LIGHTDB_STATE/LOG_BACKEND_GOLIOTH/RPC/
# SETTINGS/STREAM), CONFIG_GOLIOTH_SAMPLE_COMMON, and
# CONFIG_GOLIOTH_RPC_MAX_RESPONSE_LEN (further below) removed — golioth
# module no longer exists (see west.yml). CONFIG_GOLIOTH_FW_UPDATE's own
# replacement — MCUboot's signed-image flow was confirmed untouched and
# standalone (Phase 6, see AUDIT.md), and ota_update.c/CONFIG_FOTA_DOWNLOAD
# below (Phase 6) now do the actual fetch-and-verify.

# CONFIG_ZVFS_EVENTFD_MAX/OPEN_MAX and CONFIG_COAP_EXTENDED_OPTIONS_LEN*
# below (previously under this same "Configure Golioth SDK dependencies"
# comment) were sized for Golioth's CoAP/DTLS transport specifically and are
# removed as dead config for the same reason — with golioth's own Kconfig
# tree gone, these assignments no longer have the dependency chain that made
# them meaningful, and this Zephyr/NCS setup aborts the build on any Kconfig
# warning (not just undefined-symbol ones), so leaving them in place doesn't
# merely produce noise, it's build-breaking. Re-tune fd/heap limits for
# MQTT/TLS's actual needs in Phase 3.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=10240
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y

# Application
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_NET_LOG=y
CONFIG_NET_SHELL=y
CONFIG_REBOOT=y

# Flash memory (etc.) for firmware upgrade
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_REBOOT=y

# TODO(replace-with-mqtt): CONFIG_GOLIOTH_SAMPLE_SETTINGS_AUTOLOAD/_SHELL
# removed — these provided the `settings set golioth/psk-id ...` /
# `settings set golioth/psk ...` shell commands and DTLS-PSK credential
# auto-load documented in the original README (main.c's corresponding
# golioth_sample_credentials_get() call was already removed). CONFIG_SETTINGS
# / CONFIG_SETTINGS_RUNTIME themselves are generic Zephyr NVS-backed
# key-value storage, not Golioth-specific — kept, since Phase 3's TLS
# credential provisioning will likely reuse this same subsystem.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# MQTT/TLS uplink (Phase 3). TLS is modem-offloaded on nRF9160 — credentials
# are provisioned via modem_key_mgmt_write() (CONFIG_MODEM_KEY_MGMT), not
# Zephyr's tls_credentials/CONFIG_MBEDTLS, which only matter for the native
# (non-offloaded) socket path. See uplink_mqtt.c and AUDIT.md's Phase 3
# research notes for why.
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MODEM_KEY_MGMT=y
CONFIG_NET_SOCKETS=y

# Flash-backed offline telemetry buffer (buffer_fifo.c)
CONFIG_FLASH_PAGE_LAYOUT=y

# Misc.
CONFIG_JSON_LIBRARY=y
CONFIG_I2C=y
CONFIG_GPIO=y

# CAN interface
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CAN=y

# ICM-42688-P IMU for harsh-driving detection (Phase 5). SPI-only driver
# (no I2C backend) — see boards/nrf9160dk_nrf9160_ns.overlay. Polled via
# sensor_sample_fetch(), not interrupt/trigger mode, so no
# CONFIG_ICM42688_TRIGGER_* needed.
CONFIG_SENSOR=y
CONFIG_ICM42688=y

# OTA update (Phase 6). fota_download already wraps dfu_target's
# init/write/done/schedule_update internally (confirmed from source —
# fota_download.c's DOWNLOADER_EVT_DONE handler calls dfu_target_done() +
# dfu_target_schedule_update() for us). CONFIG_DFU_TARGET_MCUBOOT defaults
# to y given CONFIG_IMG_MANAGER and CONFIG_BOOTLOADER_MCUBOOT
# (sysbuild.conf), but CONFIG_DFU_TARGET itself (its parent menuconfig) has
# no default — first build attempt linked clean until here, then failed
# with "undefined reference to fota_download_init" because DFU_TARGET
# (and so FOTA_DOWNLOAD, which depends on DFU_TARGET, and so its
# CMakeLists.txt) was never enabled at all; explicit below. CA cert for the
# HTTPS download is provisioned via the same modem_key_mgmt_write()
# mechanism as uplink_mqtt.c, under a *separate* sec_tag
# (CONFIG_FOTA_UPDATE_SEC_TAG) — see ota_update.c.
CONFIG_DFU_TARGET=y
CONFIG_FOTA_DOWNLOAD=y
CONFIG_DOWNLOADER=y
CONFIG_DOWNLOADER_STACK_SIZE=4096
